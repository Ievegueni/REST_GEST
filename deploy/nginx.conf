# /etc/nginx/sites-available/restgest — trocar app.exemplo.ao pelo domínio real.
# SSL: sudo certbot --nginx -d app.exemplo.ao (acrescenta os blocos 443 e o redireccionamento).
server {
    listen 80;
    server_name app.exemplo.ao;

    root /srv/restgest/apps/web/dist;
    index index.html;
    client_max_body_size 6m;   # uploads até 5 MB (limite da API)

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # pedidos ao Analisador IA podem demorar
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rotas do React
    location / {
        try_files $uri /index.html;
    }
}
