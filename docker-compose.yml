# Dev: portas 5440/6390 para não colidir com instalações locais.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restgest
      POSTGRES_PASSWORD: restgest
      POSTGRES_DB: restgest
    ports: ['5440:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6390:6379']
volumes:
  pgdata:
